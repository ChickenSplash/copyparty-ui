<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <title>Files</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%237c8cff'/><path d='M9 11.5a2 2 0 0 1 2-2h3.6l2 2H21a2 2 0 0 1 2 2V20a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2z' fill='white'/></svg>">
  <link rel="stylesheet" href="/_ui/css/tokens.css">
  <link rel="stylesheet" href="/_ui/css/base.css">
  <link rel="stylesheet" href="/_ui/css/ui.css">
  <link rel="stylesheet" href="/_ui/css/layout.css">
  <link rel="stylesheet" href="/_ui/css/login.css">
  <link rel="stylesheet" href="/_ui/css/sidebar.css">
  <link rel="stylesheet" href="/_ui/css/listing.css">
  <link rel="stylesheet" href="/_ui/css/uploads.css">
  <link rel="stylesheet" href="/_ui/css/viewer.css">
  <script type="module" src="/_ui/app.js"></script>
</head>
<body>
  <div id="login" class="login" hidden>
    <form class="login-card" id="login-form" autocomplete="on">
      <div class="brand-mark big"></div>
      <h1>Files</h1>
      <p class="muted">Sign in to continue</p>
      <input type="text" name="username" autocomplete="username" value="homelab" hidden>
      <input class="field" type="password" name="password" id="login-pw" placeholder="Password" autocomplete="current-password" required>
      <button class="btn primary wide" type="submit">Sign in</button>
      <p class="login-err" id="login-err" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <button class="icon-btn" id="sidebar-btn" title="Toggle sidebar" aria-controls="sidebar"><svg class="i"><use href="#i-sidebar"/></svg></button>
      <a class="brand" href="/" data-nav="/">
        <span class="brand-mark"></span>
        <span class="brand-name" id="brand-name">Files</span>
      </a>
      <label class="search">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Search everything" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
      <div class="topbar-end">
        <span class="storage" id="storage" title="Free space"></span>
        <button class="icon-btn" id="theme-btn" title="Toggle theme"><svg class="i"><use href="#i-moon"/></svg></button>
        <button class="icon-btn" id="logout-btn" title="Sign out"><svg class="i"><use href="#i-logout"/></svg></button>
      </div>
    </header>

    <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Files">
      <div class="sidebar-head">
        <a class="tree-home" id="tree-home" href="/" data-nav="/"><svg class="i"><use href="#i-home"/></svg><span>Home</span></a>
        <button class="icon-btn sm" id="tree-collapse" title="Collapse all"><svg class="i"><use href="#i-collapse"/></svg></button>
      </div>
      <div class="tree" id="tree" role="tree" aria-label="Files"></div>
      <div class="sidebar-resize" id="sidebar-resize" title="Drag to resize"></div>
    </aside>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <main class="main" id="main">
      <div class="toolbar">
        <nav class="crumbs" id="crumbs"></nav>
        <div class="toolbar-end">
          <div class="seg" role="group" aria-label="View">
            <button class="seg-btn" data-view="list" title="List"><svg class="i"><use href="#i-list"/></svg></button>
            <button class="seg-btn" data-view="grid" title="Grid"><svg class="i"><use href="#i-grid"/></svg></button>
          </div>
          <button class="btn ghost" id="mkdir-btn" data-perm="write"><svg class="i"><use href="#i-folder-plus"/></svg><span>New folder</span></button>
          <button class="btn primary" id="upload-btn" data-perm="write"><svg class="i"><use href="#i-upload"/></svg><span>Upload</span></button>
          <input type="file" id="file-input" multiple hidden>
        </div>
      </div>

      <div class="listing" id="listing"></div>
    </main>
    </div>

    <div class="selbar" id="selbar" hidden>
      <span id="sel-count"></span>
      <button class="btn ghost sm" id="sel-dl"><svg class="i"><use href="#i-download"/></svg><span>Download</span></button>
      <button class="btn ghost sm danger" id="sel-rm" data-perm="delete"><svg class="i"><use href="#i-trash"/></svg><span>Delete</span></button>
      <button class="icon-btn sm" id="sel-clear" title="Clear selection"><svg class="i"><use href="#i-x"/></svg></button>
    </div>

    <aside class="uploads" id="uploads" hidden>
      <header>
        <strong id="up-title">Uploading</strong>
        <button class="icon-btn sm" id="up-close" title="Close"><svg class="i"><use href="#i-x"/></svg></button>
      </header>
      <div class="up-total"><div class="bar"><i id="up-bar"></i></div><span id="up-meta"></span></div>
      <ul id="up-list"></ul>
    </aside>

    <div class="dropzone" id="dropzone"><div><svg class="i xl"><use href="#i-upload"/></svg><p>Drop to upload to <b id="drop-dest"></b></p></div></div>
  </div>

  <div class="viewer" id="viewer" hidden>
    <header class="viewer-bar">
      <span class="viewer-name" id="viewer-name"></span>
      <span class="viewer-meta muted" id="viewer-meta"></span>
      <a class="icon-btn" id="viewer-dl" title="Download"><svg class="i"><use href="#i-download"/></svg></a>
      <button class="icon-btn" id="viewer-close" title="Close"><svg class="i"><use href="#i-x"/></svg></button>
    </header>
    <button class="viewer-nav prev" id="viewer-prev" title="Previous"><svg class="i"><use href="#i-chev-left"/></svg></button>
    <div class="viewer-body" id="viewer-body"></div>
    <button class="viewer-nav next" id="viewer-next" title="Next"><svg class="i"><use href="#i-chev-right"/></svg></button>
  </div>

  <div class="menu" id="menu" hidden></div>
  <dialog class="dialog" id="dialog"><form method="dialog" id="dialog-form"></form></dialog>
  <div class="toasts" id="toasts"></div>

  <svg class="sprite" width="0" height="0" aria-hidden="true">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2.2h7.2a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2.2h7.2a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2zM12 11v5M9.5 13.5h5"/></symbol>
      <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M4 17.5V7.5a2 2 0 0 1 2-2h3.3l2 2.2H17a2 2 0 0 1 2 2V11"/><path d="M4 17.5 6.3 12a1.6 1.6 0 0 1 1.5-1h12.4a.9.9 0 0 1 .8 1.3l-2.3 5.4a1.6 1.6 0 0 1-1.5 1H5.2A1.2 1.2 0 0 1 4 17.5z"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6h-6v6H5.5A1.5 1.5 0 0 1 4 19z"/></symbol>
      <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15M6 8.5h1M6 11.5h1"/></symbol>
      <symbol id="i-collapse" viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="3"/><path d="M8.5 12h7"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-10zM14 3.5v5h5"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m20.5 16-5-5-9 8.5"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10.5 5-3v9l-5-3"/></symbol>
      <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-10zM14 3.5v5h5M9 13h6M9 16.5h4"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="m8.5 8-4 4 4 4M15.5 8l4 4-4 4M13.5 5.5l-3 13"/></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="4.5" rx="1"/><path d="M5 8.5v9.5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5M10 12.5h4"/></symbol>
      <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-10zM14 3.5v5h5"/><path d="M8.5 16.5v-4h1.3a1.2 1.2 0 0 1 0 2.4H8.5M13 12.5v4h.8a1.6 1.6 0 0 0 1.6-1.6v-.8a1.6 1.6 0 0 0-1.6-1.6z"/></symbol>
      <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V5a1.5 1.5 0 0 1 1.5-1.5h2A1.5 1.5 0 0 1 14.5 5v2M6 7l1 12a2 2 0 0 0 2 1.8h6a2 2 0 0 0 2-1.8L18 7"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1 1-4z"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
      <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
      <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="i-chev-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-empty" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2.2h7.2a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M9.5 13.5h5"/></symbol>
    </defs>
  </svg>
</body>
</html>
