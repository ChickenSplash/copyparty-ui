server {
    listen 8080;
    root /srv/ui;
    server_tokens off;

    # copyparty runs with `rp-loc: /api`. cloudflared's CF-Connecting-IP and
    # X-Forwarded-Proto pass through untouched; copyparty trusts them because
    # this container is the only other one on the backend network (xff-src).
    location /api/ {
        # Resolved per request through Docker's DNS, so a recreated copyparty
        # container (new IP) doesn't leave nginx returning 502s.
        resolver 127.0.0.11 valid=30s;
        set $copyparty http://copyparty:3923;
        proxy_pass $copyparty;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # copyparty sets its own CSP; SAMEORIGIN still lets the app's viewer frame PDFs.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location = /api { return 301 /api/; }

    location /_ui/ {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Every other path is a folder view rendered by the app.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        # Only the app's own files may run; no inline script, no framing of the app.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self'; frame-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        # Expire login cookies the stock UI set on Path=/ (before rp-loc). Browsers
        # send them after the real Path=/api one and copyparty keeps the last, so
        # a stale one silently overrides every fresh login.
        add_header Set-Cookie "cppws=x; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
        add_header Set-Cookie "cppwd=x; Path=/; Max-Age=0; HttpOnly; SameSite=Lax" always;
        try_files /index.html =404;
    }
}
