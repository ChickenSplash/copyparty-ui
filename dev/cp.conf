[global]
  e2dsa
  hist: ./hist
  rp-loc: /api
  ah-alg: none
  logout: 168
  no-html
  no-dav
  no-bauth
  pw-urlp: A
  pw-hdr: A
  no-robots
  name: homelab
  i: 127.0.0.1
  p: 3923
  on404: ../deploy/plugins/du.py
[accounts]
  dev: test
  video: video
[/]
  ./data
  accs:
    A: dev
# Like the live /Backups: a separate read-only volume (its own index), so the
# du plugin's merging of volumes is tested too. Fill dev/data-backups/ with anything.
[/Backups]
  ./data-backups
  accs:
    rg: dev
# Like the live /Shared: a second account ("video", password "video") can use
# this volume and nothing else. Fill dev/data-shared/ with anything.
[/Shared]
  ./data-shared
  accs:
    A: dev
    rwmd: video
